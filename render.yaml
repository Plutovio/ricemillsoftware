services:
  # Backend Web Service (Django REST Framework)
  - type: web
    name: ricemill-backend
    env: python
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
    startCommand: |
      cd backend
      python manage.py migrate
      python manage.py seed_bg
      gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: FRONTEND_URL
        value: ${ricemill-frontend}

  # Frontend Static Site (Vite + React)
  - type: web
    name: ricemill-frontend
    env: static
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/dist
    routes:
      # Rewrite rule to handle React Router client-side routing on page refreshes
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: ${ricemill-backend}/api
